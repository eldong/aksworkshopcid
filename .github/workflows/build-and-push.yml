# CI builds the website image and publishes an immutable tag to the existing ACR.
name: Build and Push

# Run CI manually from the GitHub Actions page.
on:
  workflow_dispatch:

  # Push-based builds are temporarily disabled.
  # push:
  #   branches:
  #     - main

# Prevent overlapping builds for the same branch while preserving unrelated runs.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# OIDC login needs id-token: write; checkout and artifact upload need contents: read.
permissions:
  contents: read
  id-token: write

env:
  # Keep the image repository name consistent across CI, CD, and Kubernetes.
  IMAGE_NAME: aks-static-website

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      # Download the repository so Docker can access the Dockerfile and website.
      - name: Check out repository
        uses: actions/checkout@v4

      # Exchange GitHub's short-lived OIDC token for an Azure access token.
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Authenticate Docker to the existing registry without storing a registry password.
      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      # Build once and use the GitHub run number as a readable, unique image tag.
      - name: Build container image
        env:
          IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}
        run: docker build --tag "$IMAGE" .

      # Publish the tagged image for the deployment workflow to consume.
      - name: Push container image
        env:
          IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}
        run: docker push "$IMAGE"

      # Persist the exact image reference so CD never has to infer the CI run number.
      - name: Record image reference
        env:
          IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}
        run: printf '%s\n' "$IMAGE" > image-reference.txt

      # Make the immutable image reference available to the workflow_run-triggered CD job.
      - name: Upload image reference
        uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: image-reference.txt
          retention-days: 7
