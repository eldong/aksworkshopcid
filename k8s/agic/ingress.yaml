# Route Application Gateway traffic to the existing website Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aks-static-website
  annotations:
    # The legacy annotation is retained because AGIC uses it to select Ingress resources.
    kubernetes.io/ingress.class: azure/application-gateway
    # Probe the Nginx home page and accept normal redirect/success responses.
    appgw.ingress.kubernetes.io/health-probe-path: /
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200-399"
spec:
  # Prevent the existing NGINX controller from processing this Ingress.
  ingressClassName: azure-application-gateway
  rules:
    # Route every HTTP path to the website Service on port 80.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aks-static-website
                port:
                  number: 80
